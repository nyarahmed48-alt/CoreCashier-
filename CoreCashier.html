{en:{title:"The day has not reached CoreOS",body:"The till could not send its books up. It keeps selling, and will send them when the internet comes back.",steps:["Check the wifi when you get a moment.","Nothing is lost; the till will catch up by itself."]},ar:{title:"لم تصل مبيعات اليوم إلى CoreOs",body:"لم يستطع الصندوق رفع دفاتره. يستمر البيع، وسيرفعها عند عودة الإنترنت.",steps:["تحقق من الواي فاي عندما تستطيع.","لا شيء يضيع، سيُكمل الصندوق وحده."]},ckb:{title:"ڕۆژەکە نەگەیشتووەتە CoreOs",body:"سندوقەکە نەیتوانی دەفتەرەکانی بنێرێت. فرۆشتن بەردەوامە و کاتێک ئینتەرنێت گەڕایەوە دەیاننێرێت.",steps:["کاتێک دەرفەتت هەبوو وایفایەکە بپشکنە.","هیچ لەدەست ناچێت، سندوقەکە خۆی تەواوی دەکات."]}}},"DT-03":{priority:"P2",note:"Backup could not be written, or a restore file was rejected as not a till backup.",text:{en:{title:"The backup did not work",body:"The copy of your records could not be saved or could not be read back.",steps:["Try again from Settings, Backup.","Make sure there is room on the tablet.","Call CoreOS if it fails twice."]},ar:{title:"لم تنجح النسخة الاحتياطية",body:"تعذّر حفظ نسخة من سجلاتك أو قراءتها.",steps:["أعد المحاولة من «الإعدادات» ثم «النسخة الاحتياطية».","تأكد من وجود مساحة في الجهاز.","اتصل بـ CoreOs إذا فشلت مرتين."]},ckb:{title:"پاڵپشتەکە سەرکەوتوو نەبوو",body:"نەتوانرا کۆپییەک لە تۆمارەکانت پاشەکەوت بکرێت یان بخوێندرێتەوە.",steps:["لە «ڕێکخستن» و «پاڵپشت» دووبارە هەوڵ بدە.","دڵنیابە شوێنی بەتاڵ لە ئامێرەکەدا هەیە.","ئەگەر دوو جار شکستی هێنا پەیوەندی بە CoreOs بکە."]}}},"DT-04":{priority:"P3",manual:!0,note:"Raised by hand when a cashier entered a wrong price, quantity or name. No browser can see this.",text:{en:{title:"Something was entered wrongly",body:"A price, a count or a name was put in wrongly and needs correcting.",steps:["Correct it in Products or void the sale.","Call CoreOS with this code if you need the records changed."]},ar:{title:"أُدخلت بيانات خاطئة",body:"سعر أو عدد أو اسم أُدخل بشكل خاطئ ويحتاج تصحيحاً.",steps:["صحّحه من «المواد» أو ألغِ الفاتورة.","اتصل بـ CoreOs بهذا الرمز إذا احتجت تعديل السجلات."]},ckb:{title:"زانیاری هەڵە نووسراوە",body:"نرخ یان ژمارە یان ناوێک بە هەڵە نووسراوە و پێویستی بە ڕاستکردنەوەیە.",steps:["لە «کاڵاکان» ڕاستی بکەرەوە یان فرۆشتنەکە بسڕەوە.","ئەگەر پێویستت بە گۆڕینی تۆمارەکانە بە ئەم کۆدە پەیوەندی بکە."]}}},"DT-05":{priority:"P3",note:"A data export was asked for. Logged whether it worked or not, so a shop asking where its file went can be answered.",text:{en:{title:"Data export",body:"A copy of your records was asked for.",steps:["Look in the tablet's Downloads folder.","Call CoreOS with this code if the file is not there."]},ar:{title:"تصدير البيانات",body:"طُلبت نسخة من سجلاتك.",steps:["ابحث في مجلد التنزيلات في الجهاز.","اتصل بـ CoreOs بهذا الرمز إذا لم يكن الملف موجوداً."]},ckb:{title:"ناردنەدەرەوەی داتا",body:"داوای کۆپییەک لە تۆمارەکانت کراوە.",steps:["لە بوخچەی داگرتنەکانی ئامێرەکە بگەڕێ.","ئەگەر فایلەکە نەبوو بە ئەم کۆدە پەیوەندی بکە."]}}},"DT-09":{priority:"P2",note:"A data problem with no more specific code.",text:{en:{title:"A problem with the records",body:"Something about the saved records is not right.",steps:["Save a backup from Settings now.","Call CoreOS and read out this code."]},ar:{title:"مشكلة في السجلات",body:"هناك خلل في السجلات المحفوظة.",steps:["احفظ نسخة احتياطية من «الإعدادات» الآن.","اتصل بـ CoreOs واقرأ هذا الرمز."]},ckb:{title:"کێشە لە تۆمارەکان",body:"شتێک لە تۆمارە پاشەکەوتکراوەکان ڕاست نییە.",steps:["ئێستا لە «ڕێکخستن» پاڵپشتێک پاشەکەوت بکە.","پەیوەندی بە CoreOs بکە و ئەم کۆدە بخوێنەوە."]}}},"AC-01":{priority:"P2",note:"Camera unavailable: no device, permission refused, the getUserMedia watchdog fired, or a photo decoded to nothing.",text:{en:{title:"The scanner is not reading",body:"The camera could not be used to read barcodes.",steps:["Use the hand scanner, or type the number.","Close the app and open it again.","Call CoreOS with this code if it stays."]},ar:{title:"القارئ لا يقرأ",body:"تعذّر استخدام الكاميرا لقراءة الباركود.",steps:["استخدم القارئ اليدوي أو اكتب الرقم.","أغلق البرنامج وافتحه من جديد.","اتصل بـ CoreOs بهذا الرمز إذا استمر."]},ckb:{title:"سکانەر ناخوێنێتەوە",body:"نەتوانرا کامێرا بۆ خوێندنەوەی بارکۆد بەکاربهێنرێت.",steps:["سکانەری دەستی بەکاربهێنە یان ژمارەکە بنووسە.","بەرنامەکە دابخە و بیکەرەوە.","ئەگەر مایەوە بە ئەم کۆدە پەیوەندی بکە."]}}},"AC-02":{priority:"P2",note:"The printer did not answer: out of range, switched off, or this browser has no Web Bluetooth at all.",text:{en:{title:"The printer is not printing",body:"The till could not reach the printer. The sale is saved either way.",steps:["Check the printer is switched on and has paper.","Print again from Sales.","Or use Share to send the receipt."]},ar:{title:"الطابعة لا تطبع",body:"لم يستطع الصندوق الوصول إلى الطابعة. الفاتورة محفوظة على كل حال.",steps:["تأكد أن الطابعة مشغّلة وفيها ورق.","أعد الطباعة من «المبيعات».","أو استخدم «مشاركة» لإرسال الفاتورة."]},ckb:{title:"چاپکەر چاپ ناکات",body:"سندوقەکە نەیگەیشتە چاپکەرەکە. فرۆشتنەکە بە هەر حاڵ پاشەکەوت کراوە.",steps:["دڵنیابە چاپکەرەکە کارایە و کاغەزی تێدایە.","لە «فرۆشتنەکان» دووبارە چاپی بکە.","یان بە «هاوبەشکردن» بینێرە."]}}},"AC-03":{priority:"P3",manual:!0,note:"Faded print, or paper jammed. Nothing a browser can see — the printer reports nothing back.",text:{en:{title:"The print is bad",body:"The paper is jamming, or the print is too faint to read.",steps:["Open the printer and reseat the roll.","Try a fresh roll of paper.","Call CoreOS with this code if it stays faint."]},ar:{title:"الطباعة رديئة",body:"الورق يعلق أو الطباعة باهتة لا تُقرأ.",steps:["افتح الطابعة وأعد تركيب الرول.","جرّب رولاً جديداً.","اتصل بـ CoreOs بهذا الرمز إذا بقيت باهتة."]},ckb:{title:"چاپەکە خراپە",body:"کاغەزەکە دەگیرێت، یان چاپەکە ئەوەندە کاڵە کە ناخوێندرێتەوە.",steps:["چاپکەرەکە بکەرەوە و ڕۆڵەکە دابنێوە.","ڕۆڵێکی نوێ تاقی بکەرەوە.","ئەگەر کاڵ مایەوە پەیوەندی بکە."]}}},"AC-04":{priority:"P2",note:"Paired device gone, or a Bluetooth Classic printer that Web Bluetooth cannot reach at all. The second is not a fault — it is the wrong kind of printer.",text:{en:{title:"Bluetooth has been lost",body:"The tablet can no longer reach the printer or scanner it was paired with.",steps:["Switch the printer or scanner off and on.","Pair it again in Settings, Printer.","Call CoreOS with this code if it will not pair."]},ar:{title:"انقطع البلوتوث",body:"لم يعد الجهاز يصل إلى الطابعة أو القارئ المقترن به.",steps:["أطفئ الطابعة أو القارئ وأعد تشغيله.","أعد الاقتران من «الإعدادات» ثم «الطابعة».","اتصل بـ CoreOs بهذا الرمز إذا لم يقترن."]},ckb:{title:"بلوتوس پچڕا",body:"ئامێرەکە چیتر ناگاتە ئەو چاپکەر یان سکانەرەی پێوەی بەستراوە.",steps:["چاپکەر یان سکانەرەکە بکوژێنەوە و بیکەرەوە.","لە «ڕێکخستن» و «چاپکەر» دووبارە جووتی بکە.","ئەگەر جووت نەبوو پەیوەندی بکە."]}}},"AC-05":{priority:"P3",manual:!0,note:"Power bank or charger fault. Reported by the shop; the tablet cannot see what it is plugged into.",text:{en:{title:"The charger is not working",body:"The power bank or charger is not charging the tablet.",steps:["Try a different cable and socket.","Call CoreOS with this code to arrange a replacement."]},ar:{title:"الشاحن لا يعمل",body:"البطارية المحمولة أو الشاحن لا يشحن الجهاز.",steps:["جرّب كابلاً ومقبساً آخر.","اتصل بـ CoreOs بهذا الرمز لترتيب بديل."]},ckb:{title:"شارژەرەکە کار ناکات",body:"پاوەربانک یان شارژەرەکە ئامێرەکە شارژ ناکات.",steps:["کەیبڵ و پریزێکی تر تاقی بکەرەوە.","بۆ گۆڕینەوە بە ئەم کۆدە پەیوەندی بکە."]}}},"AC-09":{priority:"P3",manual:!0,note:"An accessory problem with no more specific code.",text:{en:{title:"A problem with the equipment",body:"Something attached to the till is not behaving.",steps:["Switch it off and on.","Call CoreOS and read out this code."]},ar:{title:"مشكلة في الملحقات",body:"أحد الأجهزة الموصولة بالصندوق لا يعمل كما ينبغي.",steps:["أطفئه وأعد تشغيله.","اتصل بـ CoreOs واقرأ هذا الرمز."]},ckb:{title:"کێشە لە ئامێرەکان",body:"شتێکی بەستراو بە سندوقەکەوە وەک پێویست کار ناکات.",steps:["بیکوژێنەوە و بیکەرەوە.","پەیوەندی بە CoreOs بکە و ئەم کۆدە بخوێنەوە."]}}},"TB-01":{priority:"P1",manual:!0,note:"Tablet will not turn on, or switches itself off. Nothing a page can detect — the page is gone with it. Raised by the shop or by Device Check's questions.",text:{en:{title:"The tablet turns itself off",body:"This tablet will not turn on, or switches off on its own while it is being used.",steps:["Charge it for an hour with the shop's charger and try again.","Hold the power button for ten seconds.","Call CoreOS with this code — the tablet probably needs replacing."]},ar:{title:"الجهاز يطفئ نفسه",body:"هذا الجهاز لا يعمل، أو ينطفئ من تلقاء نفسه أثناء الاستخدام.",steps:["اشحنه ساعة بشاحن المحل وأعد المحاولة.","اضغط زر التشغيل عشر ثوانٍ.","اتصل بـ CoreOs بهذا الرمز — غالباً يحتاج الجهاز إلى تبديل."]},ckb:{title:"ئامێرەکە خۆی دەکوژێتەوە",body:"ئەم ئامێرە ناکرێتەوە، یان لە کاتی بەکارهێناندا خۆی دەکوژێتەوە.",steps:["کاتژمێرێک بە شارژەری دوکانەکە شارژی بکە و دووبارە هەوڵ بدە.","دوگمەی کارەبا دە چرکە ڕابگرە.","بە ئەم کۆدە پەیوەندی بکە — لەوانەیە پێویستی بە گۆڕین بێت."]}}},"TB-02":{priority:"P2",note:"Battery below 15% and not charging, read through navigator.getBattery. Absent on many Android browsers.",text:{en:{title:"The battery is low",body:"This tablet is running low on charge and is not plugged in.",steps:["Plug the tablet in now.","Finish the sale you are on first — nothing is lost if it switches off."]},ar:{title:"البطارية منخفضة",body:"شحن هذا الجهاز منخفض وهو غير موصول بالكهرباء.",steps:["وصّل الجهاز بالشاحن الآن.","أكمل الفاتورة الحالية أولاً — لا شيء يضيع إذا انطفأ."]},ckb:{title:"باتری کەمە",body:"شارژی ئەم ئامێرە کەمە و بە کارەبا نەبەستراوە.",steps:["ئێستا ئامێرەکە بخەرە سەر شارژ.","یەکەم ئەم فرۆشتنە تەواو بکە — ئەگەر کوژایەوە هیچ لەدەست ناچێت."]}}},"TB-03":{priority:"P2",note:"Screen cracked, or part of the touch surface is dead. Device Check's touch grid finds dead areas; a crack is reported by eye.",text:{en:{title:"The screen is damaged",body:"The screen is cracked, or part of it does not answer when it is touched.",steps:["Try the counter in a part of the screen that still works.","Call CoreOS with this code to arrange a replacement."]},ar:{title:"الشاشة متضررة",body:"الشاشة مكسورة، أو جزء منها لا يستجيب للمس.",steps:["استخدم جزءاً من الشاشة لا يزال يعمل مؤقتاً.","اتصل بـ CoreOs بهذا الرمز لترتيب التبديل."]},ckb:{title:"شاشەکە زیانی پێگەیشتووە",body:"شاشەکە شکاوە، یان بەشێکی وەڵام نادات کاتێک دەستی لێ دەدرێت.",steps:["بۆ کاتێک ئەو بەشەی شاشە بەکاربهێنە کە کار دەکات.","بۆ گۆڕینەوە بە ئەم کۆدە پەیوەندی بکە."]}}},"TB-04":{priority:"P2",note:"A sale took longer than a second and a half to commit, measured on the tablet. Raised once per session.",text:{en:{title:"The tablet is slow",body:"This tablet is taking longer than it should to save a sale.",steps:["Close other apps on the tablet.","Close the till and open it again.","Call CoreOS with this code if it stays slow."]},ar:{title:"الجهاز بطيء",body:"هذا الجهاز يستغرق وقتاً أطول مما ينبغي لحفظ الفاتورة.",steps:["أغلق البرامج الأخرى على الجهاز.","أغلق الصندوق وافتحه من جديد.","اتصل بـ CoreOs بهذا الرمز إذا بقي بطيئاً."]},ckb:{title:"ئامێرەکە خاوە",body:"ئەم ئامێرە کاتێکی زیاتر لە پێویست دەخایەنێت بۆ پاشەکەوتکردنی فرۆشتن.",steps:["بەرنامەکانی تر دابخە.","سندوقەکە دابخە و بیکەرەوە.","ئەگەر خاو مایەوە پەیوەندی بکە."]}}},"TB-05":{priority:"P2",note:"The tablet reports itself offline, or Bluetooth is unavailable where it is needed.",text:{en:{title:"There is no connection",body:"The tablet is not on the internet. The till keeps selling without it.",steps:["Carry on selling; nothing is lost.","Check the wifi when the shop is quiet."]},ar:{title:"لا يوجد اتصال",body:"الجهاز غير متصل بالإنترنت. يستمر الصندوق بالبيع بدونه.",steps:["تابع البيع، لا شيء يضيع.","تحقق من الواي فاي عندما يهدأ المحل."]},ckb:{title:"پەیوەندی نییە",body:"ئامێرەکە لەسەر ئینتەرنێت نییە. سندوقەکە بەبێ ئەویش بەردەوام دەفرۆشێت.",steps:["بەردەوام بە لە فرۆشتن، هیچ لەدەست ناچێت.","کاتێک دوکان هێمن بوو وایفایەکە بپشکنە."]}}},"TB-06":{priority:"P2",manual:!0,note:"Overheating. No browser can read a temperature — this is always the shop's own answer.",text:{en:{title:"The tablet gets very hot",body:"This tablet becomes hot enough to be uncomfortable to hold while it is being used.",steps:["Take it out of any case and off direct sun.","Let it cool before charging it again.","Call CoreOS with this code."]},ar:{title:"الجهاز يسخن كثيراً",body:"يسخن هذا الجهاز أثناء الاستخدام حتى يصعب الإمساك به.",steps:["أخرجه من الغلاف وأبعده عن الشمس.","دعه يبرد قبل إعادة شحنه.","اتصل بـ CoreOs بهذا الرمز."]},ckb:{title:"ئامێرەکە زۆر گەرم دەبێت",body:"ئەم ئامێرە لە کاتی بەکارهێناندا ئەوەندە گەرم دەبێت کە بە ئەستەم دەگیرێت.",steps:["لە قاپەکەی دەریبهێنە و لە تیشکی خۆر دووری بخەرەوە.","پێش شارژکردنەوە لێی گەڕێ سارد ببێتەوە.","بە ئەم کۆدە پەیوەندی بکە."]}}},"TB-07":{priority:"P2",manual:!0,note:"Dropped, or got wet. Invisible to any API; it explains faults that otherwise look unrelated, so it is worth asking.",text:{en:{title:"The tablet was dropped or got wet",body:"Something happened to this tablet that may be behind the other problems.",steps:["Stop charging it until it is completely dry.","Save a backup from CoreCashier now.","Call CoreOS with this code."]},ar:{title:"سقط الجهاز أو ابتلّ",body:"حدث شيء لهذا الجهاز قد يكون سبب بقية المشاكل.",steps:["لا تشحنه حتى يجف تماماً.","احفظ نسخة احتياطية من CoreCashier الآن.","اتصل بـ CoreOs بهذا الرمز."]},ckb:{title:"ئامێرەکە کەوتووە یان تەڕ بووە",body:"شتێک بەسەر ئەم ئامێرەدا هاتووە کە لەوانەیە هۆکاری کێشەکانی تر بێت.",steps:["هەتا بە تەواوی وشک نەبێتەوە شارژی مەکە.","ئێستا لە CoreCashier پاڵپشتێک پاشەکەوت بکە.","بە ئەم کۆدە پەیوەندی بکە."]}}},"TB-08":{priority:"P1",manual:!0,note:"Lost or stolen. Raised by the shop. The till on it should be stopped from the office and its licence not renewed.",text:{en:{title:"The tablet is lost or stolen",body:"This tablet is no longer with the shop.",steps:["Call CoreOS with this code straight away so the till on it can be stopped.","Your records are on that tablet only — tell CoreOS when the last backup was."]},ar:{title:"الجهاز مفقود أو مسروق",body:"لم يعد هذا الجهاز لدى المحل.",steps:["اتصل بـ CoreOs بهذا الرمز فوراً لإيقاف الصندوق عليه.","سجلاتك على ذلك الجهاز وحده — أخبر CoreOs بموعد آخر نسخة احتياطية."]},ckb:{title:"ئامێرەکە ون بووە یان دزراوە",body:"ئەم ئامێرە چیتر لای دوکانەکە نییە.",steps:["یەکسەر بە ئەم کۆدە پەیوەندی بکە تا سندوقەکەی لەسەر ڕابگیرێت.","تۆمارەکانت تەنها لەسەر ئەو ئامێرەن — بە CoreOs بڵێ دوایین پاڵپشت کەی بوو."]}}},"TB-09":{priority:"P2",note:"Low device storage — quota nearly used, or a quota-exceeded write. Details say 'low storage'.",text:{en:{title:"The tablet is nearly full",body:"There is very little room left on this tablet, and the till may soon stop saving.",steps:["Save a backup from Settings now.","Delete photos or other apps' files.","Call CoreOS and read out this code."]},ar:{title:"الجهاز ممتلئ تقريباً",body:"لم تبقَ مساحة تُذكر في هذا الجهاز، وقد يتوقف الصندوق عن الحفظ قريباً.",steps:["احفظ نسخة احتياطية من «الإعدادات» الآن.","احذف الصور أو ملفات البرامج الأخرى.","اتصل بـ CoreOs واقرأ هذا الرمز."]},ckb:{title:"ئامێرەکە خەریکە پڕ دەبێت",body:"شوێنی بەتاڵی کەم ماوەتەوە، و لەوانەیە بەم زووانە سندوقەکە وازبهێنێت لە پاشەکەوتکردن.",steps:["ئێستا لە «ڕێکخستن» پاڵپشتێک پاشەکەوت بکە.","وێنە یان فایلی بەرنامەکانی تر بسڕەوە.","پەیوەندی بە CoreOs بکە و ئەم کۆدە بخوێنەوە."]}}}},hg=Object.keys(_a);function bu(n,e){const t=_a[n];return t.text[e]??t.text.en}const Sl={P1:{border:"#5d3346",bg:"#180f16",text:"#f0879d"},P2:{border:"#4a3a1a",bg:"#1a1208",text:"#f0c078"},P3:{border:"#232b40",bg:"#0b1120",text:"#98a0bb"}};/**
